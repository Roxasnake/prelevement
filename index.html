<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

:root {
  --bg:          #f4f6fa;
  --surface:     #ffffff;
  --surface2:    #f0f2f7;
  --border:      #e2e6f0;
  --border2:     #cdd3e2;
  --accent:      #3b5bff;
  --accent-dim:  rgba(59,91,255,0.08);
  --accent-soft: rgba(59,91,255,0.15);
  --text:        #1a1d2e;
  --text-muted:  #7880a0;
  --danger:      #e8344a;
  --danger-dim:  rgba(232,52,74,0.10);
  --green:       #12b76a;
  --green-dim:   rgba(18,183,106,0.10);
  --orange:      #f59e0b;
  --purple:      #7c3aff;
  --purple-dim:  rgba(124,58,255,0.08);
  --radius:      14px;
  --shadow:      0 2px 12px rgba(59,91,255,0.07);
  --shadow-md:   0 4px 24px rgba(59,91,255,0.13);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Sora', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── LOADING ── */
#screen-loading {
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px;
}
.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--border2); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: var(--text-muted); }

/* ── AUTH ── */
#screen-auth {
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 24px 18px 48px;
}
.auth-logo     { font-size: 50px; text-align: center; margin-bottom: 6px; }
.auth-headline {
  font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--accent); text-align: center; margin-bottom: 4px;
}
.auth-sub { font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 28px; line-height: 1.6; }
.auth-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; padding: 6px 20px 24px;
  width: 100%; max-width: 420px; box-shadow: var(--shadow-md);
}
.auth-tabs { display: flex; border-bottom: 1px solid var(--border); margin: 0 -20px 20px; }
.auth-tab {
  flex: 1; text-align: center; padding: 14px 0;
  font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted);
  cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.18s;
}
.auth-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.auth-fields { display: flex; flex-direction: column; gap: 11px; margin-bottom: 14px; }
.auth-input {
  background: var(--surface2); border: 1.5px solid var(--border);
  border-radius: 11px; color: var(--text); font-family: 'Sora', sans-serif;
  font-size: 16px; padding: 13px 14px; width: 100%; outline: none;
  transition: border-color 0.2s, box-shadow 0.2s; -webkit-appearance: none;
}
.auth-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); background: var(--surface); }
.auth-input::placeholder { color: #b0b8d0; }

/* Password strength */
.pwd-strength { margin-top: 6px; display: none; }
.pwd-strength.show { display: block; }
.pwd-bar { height: 4px; border-radius: 99px; background: var(--border); margin-bottom: 5px; overflow: hidden; }
.pwd-fill { height: 100%; border-radius: 99px; transition: width 0.3s, background 0.3s; }
.pwd-label { font-size: 11px; font-weight: 600; }
.str-1 .pwd-fill { width: 25%; background: var(--danger); } .str-1 .pwd-label { color: var(--danger); }
.str-2 .pwd-fill { width: 50%; background: var(--orange); } .str-2 .pwd-label { color: var(--orange); }
.str-3 .pwd-fill { width: 75%; background: var(--orange); } .str-3 .pwd-label { color: var(--orange); }
.str-4 .pwd-fill { width: 100%; background: var(--green); } .str-4 .pwd-label { color: var(--green); }

.auth-msg {
  font-size: 12px; font-weight: 500; padding: 10px 12px; border-radius: 9px;
  margin-bottom: 12px; display: none; line-height: 1.4;
}
.auth-msg.error   { color: var(--danger); background: var(--danger-dim); border: 1px solid rgba(232,52,74,0.2); }
.auth-msg.success { color: var(--green);  background: var(--green-dim);  border: 1px solid rgba(18,183,106,0.2); }
.btn-auth {
  width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 12px;
  font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.08em;
  padding: 15px; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 16px rgba(59,91,255,0.25);
}
.btn-auth:active { transform: scale(0.98); } .btn-auth:disabled { opacity: 0.55; cursor: not-allowed; }
.auth-forgot {
  text-align: center; margin-top: 14px; font-size: 12px; color: var(--text-muted);
  cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
}

/* ── APP ── */
#screen-app { min-height: 100vh; padding-bottom: 110px; }

/* ── HEADER ── */
.header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 16px 18px 0; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow);
}
.header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 6px; }
.header-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.app-title {
  font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); white-space: nowrap;
}
.user-label { font-size: 10px; color: var(--text-muted); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.header-actions { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.icon-btn {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted);
  font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.07em;
  padding: 6px 8px; border-radius: 8px; cursor: pointer; transition: all 0.18s; white-space: nowrap;
}
.icon-btn:active { opacity: 0.7; }
.icon-btn.manage     { background: var(--accent-dim); border-color: var(--accent-soft); color: var(--accent); }
.icon-btn.manage.active { background: var(--green-dim); border-color: rgba(18,183,106,0.3); color: var(--green); }
.icon-btn.foyer-btn  { background: var(--purple-dim); border-color: rgba(124,58,255,0.2); color: var(--purple); }
.icon-btn.logout-btn { background: var(--danger-dim); border-color: rgba(232,52,74,0.2); color: var(--danger); }

/* ── SUMMARY ── */
.summary {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px;
  background: var(--border); border-top: 1px solid var(--border); margin: 0 -18px;
}
.summary-cell { background: var(--surface); padding: 10px 8px 12px; text-align: center; }
.summary-value { font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; display: block; margin-bottom: 2px; }
.summary-value.total    { color: var(--text); }
.summary-value.paid     { color: var(--green); }
.summary-value.remaining{ color: var(--accent); }
.summary-label { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); }

/* ── PROGRESS ── */
.progress-wrap { background: var(--surface); padding: 8px 18px 12px; border-bottom: 1px solid var(--border); }
.progress-header { display: flex; justify-content: space-between; margin-bottom: 5px; }
.progress-label { font-size: 10px; color: var(--text-muted); font-weight: 500; }
.progress-pct { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--accent); font-weight: 700; }
.progress-track { height: 5px; background: var(--surface2); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent) 0%, #7c3aff 100%); border-radius: 99px; transition: width 0.45s cubic-bezier(.4,0,.2,1); }

/* ── TODAY BANNER ── */
.today-banner {
  margin: 12px 14px 0;
  background: linear-gradient(135deg, #3b5bff 0%, #7c3aff 100%);
  border-radius: var(--radius); padding: 14px;
  display: none; align-items: flex-start; gap: 12px;
  color: white; box-shadow: 0 4px 20px rgba(59,91,255,0.3);
  animation: slideDown 0.3s cubic-bezier(.4,0,.2,1);
}
.today-banner.show { display: flex; }
@keyframes slideDown { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
.today-banner-icon { font-size: 22px; flex-shrink: 0; margin-top: 1px; }
.today-banner-content { flex: 1; min-width: 0; }
.today-banner-title { font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.8; margin-bottom: 8px; }
.today-banner-items { display: flex; flex-direction: column; gap: 4px; }
.today-banner-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.today-banner-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.today-banner-amt  { font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; flex-shrink: 0; }
.today-banner-total { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.2); display: flex; justify-content: space-between; font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; }
.today-banner-close {
  background: rgba(255,255,255,0.18); border: none; color: white;
  width: 26px; height: 26px; border-radius: 50%; font-size: 16px;
  cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
}
.today-banner-close:active { background: rgba(255,255,255,0.35); }

/* ── LIST ── */
.list { padding: 12px 14px 0; display: flex; flex-direction: column; gap: 8px; }

/* ── EMPTY ── */
.empty-state { display: flex; flex-direction: column; align-items: center; padding: 60px 30px 40px; text-align: center; }
.empty-icon { font-size: 52px; margin-bottom: 16px; animation: float 3s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
.empty-title { font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: var(--text); margin-bottom: 8px; }
.empty-sub { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-bottom: 28px; }
.btn-empty-add { background: var(--accent); color: #fff; border: none; border-radius: 12px; font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; padding: 14px 28px; cursor: pointer; box-shadow: 0 4px 16px rgba(59,91,255,0.3); transition: all 0.2s; }
.btn-empty-add:active { transform: scale(0.97); }

/* ── ITEM ── */
.item {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  display: flex; align-items: center; gap: 12px; padding: 13px 14px;
  cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden;
  user-select: none; box-shadow: var(--shadow);
}
.item:active { transform: scale(0.985); box-shadow: none; }
.item.checked { background: #f9fafb; border-color: transparent; box-shadow: none; opacity: 0.6; }
.item.checked .item-label { text-decoration: line-through; color: var(--text-muted); }
.item.checked .amount    { color: var(--green); }
.item.checked .day-badge { background: var(--green-dim); color: var(--green); }
.item.next-up  { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-soft), var(--shadow-md); }
.item.due-today{ border-color: rgba(245,158,11,0.5); box-shadow: 0 0 0 1px rgba(245,158,11,0.2), var(--shadow-md); }
.item.due-today .day-badge { background: rgba(245,158,11,0.12); color: var(--orange); }
.day-badge {
  width: 40px; height: 40px; border-radius: 11px; background: var(--accent-dim);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700; color: var(--accent); transition: all 0.2s;
}
.item-content { flex: 1; min-width: 0; }
.item-label { font-size: 14px; font-weight: 500; color: var(--text); transition: color 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.amount { font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700; color: var(--text); flex-shrink: 0; transition: color 0.2s; }
.check-icon { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s; background: var(--surface2); }
.item.checked .check-icon { border-color: var(--green); background: var(--green); }
.check-icon svg { opacity: 0; transform: scale(0.4); transition: all 0.2s; }
.item.checked .check-icon svg { opacity: 1; transform: scale(1); }
.next-tag  { position: absolute; top: 7px; right: 9px; font-family: 'Space Mono', monospace; font-size: 8px; font-weight: 700; letter-spacing: 0.1em; color: var(--accent); background: var(--accent-dim); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--accent-soft); }
.today-tag { position: absolute; top: 7px; right: 9px; font-family: 'Space Mono', monospace; font-size: 8px; font-weight: 700; letter-spacing: 0.1em; color: var(--orange); background: rgba(245,158,11,0.12); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(245,158,11,0.3); }

/* ── EDIT MODE ── */
.item.edit-mode { cursor: default; flex-direction: column; align-items: stretch; gap: 10px; padding: 14px; border-color: var(--accent-soft); background: #fafbff; }
.item.edit-mode:active { transform: none; }
.edit-row { display: flex; align-items: center; gap: 10px; }
.edit-badge-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); margin-bottom: 4px; }
.edit-input { background: var(--surface); border: 1px solid var(--border2); border-radius: 9px; color: var(--text); font-family: 'Sora', sans-serif; font-size: 14px; font-weight: 500; padding: 9px 11px; outline: none; width: 100%; transition: border-color 0.18s; -webkit-appearance: none; }
.edit-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
.edit-actions { display: flex; gap: 8px; margin-top: 2px; }
.btn-save { flex: 1; background: var(--accent); color: #fff; border: none; border-radius: 9px; font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; padding: 10px; cursor: pointer; transition: all 0.18s; }
.btn-save:active { opacity: 0.8; }
.btn-del { background: var(--danger-dim); color: var(--danger); border: 1px solid rgba(232,52,74,0.2); border-radius: 9px; font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; padding: 10px 14px; cursor: pointer; transition: all 0.18s; }
.btn-del:active { background: var(--danger); color: #fff; }

/* ── FAB ── */
.fab { position: fixed; bottom: 24px; right: 18px; width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 28px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(59,91,255,0.4); transition: all 0.2s; z-index: 200; }
.fab:active { transform: scale(0.92); }
.fab.hidden { display: none; }

/* ── OVERLAYS & SHEETS ── */
.overlay {
  position: fixed; inset: 0; background: rgba(26,29,46,0.45);
  backdrop-filter: blur(4px); z-index: 300; display: flex; align-items: flex-end;
  opacity: 0; pointer-events: none; transition: opacity 0.25s;
}
.overlay.open { opacity: 1; pointer-events: all; }
.sheet {
  background: var(--surface); border-top: 1px solid var(--border);
  border-radius: 22px 22px 0 0; padding: 22px 18px 44px; width: 100%;
  transform: translateY(40px); transition: transform 0.3s cubic-bezier(.4,0,.2,1);
  box-shadow: 0 -4px 32px rgba(59,91,255,0.10);
}
.overlay.open .sheet { transform: translateY(0); }
.sheet-handle { width: 40px; height: 4px; background: var(--border2); border-radius: 99px; margin: 0 auto 18px; }
.sheet-title { font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 18px; }
.field-group { display: flex; flex-direction: column; gap: 14px; margin-bottom: 18px; }
.field-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; color: var(--text-muted); margin-bottom: 5px; }
.field-input { background: var(--surface2); border: 1.5px solid var(--border); border-radius: 11px; color: var(--text); font-family: 'Sora', sans-serif; font-size: 16px; padding: 13px 14px; width: 100%; outline: none; transition: border-color 0.2s, box-shadow 0.2s; -webkit-appearance: none; }
.field-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); background: var(--surface); }
.field-input::placeholder { color: #b0b8d0; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.error-msg { font-size: 11px; color: var(--danger); margin-top: 4px; display: none; font-weight: 500; }
.error-msg.show { display: block; }
.btn-add { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 12px; font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; padding: 15px; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 16px rgba(59,91,255,0.25); }
.btn-add:active { transform: scale(0.98); opacity: 0.9; }
.btn-cancel { width: 100%; background: none; color: var(--text-muted); border: 1.5px solid var(--border); border-radius: 12px; font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.08em; padding: 12px; cursor: pointer; margin-top: 10px; transition: all 0.2s; }
.btn-cancel:active { background: var(--surface2); }

/* ── FOYER / SHARE SHEET ── */
.sheet-title.purple { color: var(--purple); }
.foyer-section { margin-bottom: 20px; }
.foyer-section-title { font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }

.code-box {
  background: var(--surface2); border: 1.5px solid var(--border2);
  border-radius: 12px; padding: 14px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.code-value {
  font-family: 'Space Mono', monospace; font-size: 22px; font-weight: 700;
  letter-spacing: 0.2em; color: var(--purple);
}
.btn-copy {
  background: var(--purple-dim); border: 1px solid rgba(124,58,255,0.2);
  color: var(--purple); border-radius: 8px;
  font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700; letter-spa
